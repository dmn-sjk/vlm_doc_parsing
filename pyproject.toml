[project]
name = "vlm-finetuning"
version = "0.1.0"
description = "Distributed LoRA fine-tuning of Qwen2.5-VL for structured JSON document parsing (TRL + FSDP + SLURM)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }

# Versions are pinned exactly, not floated. TRL/PEFT/Accelerate move fast and the VLM code
# paths in SFTTrainer especially so -- several load-bearing behaviours this project relies
# on (prompt-completion masking for vision datasets, `chunked_nll` refusing a PEFT-wrapped
# lm_head, the vision collator's key set) are version-specific. A resolver free to pick
# newer wheels would silently change training semantics.
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.16.1",
    "trl==1.12.0",
    "peft==0.20.0",
    "accelerate==1.14.0",
    "datasets==4.8.5",
    "huggingface-hub==1.29.0",
    "qwen-vl-utils==0.0.14",
    "safetensors==0.8.0",
    "numpy==2.5.2",
    "pillow==12.3.0",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.3",
    "levenshtein==0.27.4",
    "wandb==0.29.0",
]

[dependency-groups]
dev = ["ruff>=0.6"]

# --- torch from the CUDA 12.8 index ---------------------------------------------------
# A100 is sm80; the cu128 wheels cover it. PyPI's default `torch` wheel bundles a different
# CUDA runtime, so the index has to be pinned explicitly or `uv sync` silently installs a
# build that does not match what the cluster ran.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

# Resolve for the platform this actually runs on. Without this, uv tries to solve for
# macOS/Windows too, where the cu128 wheels do not exist, and the lock fails.
[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# Freeze the resolution horizon to the date the trained environment was built
# (2026-08-29). Without it, re-locking picks up newer patch releases of transitive deps and
# the lock no longer reproduces the environment that produced the published adapter.
# Raise this date deliberately when you intend to upgrade, and re-run the smoke test.
exclude-newer = "2026-08-30T00:00:00Z"

[tool.ruff]
line-length = 100
