# Single GPU, no distributed wrapper: the quickest check of the data path, loss mask and
# adapter save. 8.2 B bf16 + LoRA + gradient checkpointing at a small max_pixels fits in 40 GB.
compute_environment: LOCAL_MACHINE
distributed_type: 'NO'
mixed_precision: bf16
downcast_bf16: false
use_cpu: false
debug: false
enable_cpu_affinity: false
machine_rank: 0
num_machines: 1
num_processes: 1
rdzv_backend: static
same_network: true
main_training_function: main
