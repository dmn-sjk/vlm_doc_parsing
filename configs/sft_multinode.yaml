# 2 nodes x 8 A100 (16 ranks): the Published run's hyperparameters at twice the ranks.
# Pair with configs/accelerate_fsdp.yaml and slurm/train_multinode.sbatch.
extends: sft_1node.yaml

train:
  output_dir: ${SITE_WORK_DIR}/runs/cord-lora-2n8g
  run_name: qwen25vl-cord-lora-2n8g
  # 16 ranks x 2 per device x 1 accumulation = global batch 32.
  gradient_accumulation_steps: 1
