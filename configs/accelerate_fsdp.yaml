# FSDP1 FULL_SHARD for Qwen2.5-VL-7B + LoRA. Reasoning: docs/design-notes.md#fsdp-wrap-policy.
# num_processes / num_machines / machine_rank / main_process_* are single-node defaults that
# the slurm/ launchers override on the `accelerate launch` command line.

compute_environment: LOCAL_MACHINE
distributed_type: FSDP
mixed_precision: bf16  # only the trainable LoRA units are upcast to fp32
downcast_bf16: false
use_cpu: false
debug: false
enable_cpu_affinity: false
machine_rank: 0
num_machines: 1
num_processes: 8
rdzv_backend: static
same_network: true
main_training_function: main

fsdp_config:
  fsdp_version: 1  # use_orig_params exists only in FSDP1 (docs/adr/0003-fsdp1-full-state-dict.md)
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_reshard_after_forward: FULL_SHARD
  fsdp_offload_params: false  # CPU offload would throttle the run

  # The model's own _no_split_modules. Without the vision block the whole ViT is one unit.
  # Under PEFT these names still reach FSDP, ORed with one unit per LoRA linear.
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: Qwen2_5_VLDecoderLayer,Qwen2_5_VLVisionBlock

  fsdp_use_orig_params: true  # frozen ViT and trainable LoRA params share FSDP units

  # Only local rank 0 reads the 16 GB checkpoint (else 8 x 16 GB of host RAM per node);
  # requires sync_module_states, which also gives every rank rank 0's LoRA init.
  fsdp_cpu_ram_efficient_loading: true
  fsdp_sync_module_states: true

  fsdp_state_dict_type: FULL_STATE_DICT  # SHARDED_STATE_DICT silently saves no adapter

  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_forward_prefetch: false

  # transformers' gradient checkpointing (SFTConfig) does this; FSDP's would also wrap every
  # LoRA linear, and the two are mutually exclusive.
  fsdp_activation_checkpointing: false

  fsdp_min_num_params: 0  # unused with TRANSFORMER_BASED_WRAP
