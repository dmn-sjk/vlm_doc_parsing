# Smoke test: 1 GPU, 5 optimizer steps, 16 training examples, tiny images, no W&B.
# Runs on gpu-short (1 h limit) via slurm/smoke_1gpu.sbatch. Purpose is to fail fast on
# the data path, the chat template, the loss mask, the PEFT wiring and the adapter save --
# not to learn anything. Pair with configs/accelerate_single.yaml.

data:
  dataset_id: naver-clova-ix/cord-v2
  max_train_samples: 16
  max_eval_samples: 8
  # 64..256 visual tokens (28*28 px per token after the 2x2 merge). ~5x cheaper than the
  # production cap, which is the whole point: a smoke run should be dominated by startup.
  min_pixels: 50176      # 64 * 28 * 28
  max_pixels: 200704     # 256 * 28 * 28
  max_length: 2048
  group_by_length: true  # still exercised, so the custom sampler is on the tested path
  num_proc: 4
  seed: 42

model:
  base_model: Qwen/Qwen2.5-VL-7B-Instruct
  attn_implementation: sdpa   # flash-attn is NOT installed in this venv
  dtype: bfloat16
  freeze_vision_tower: true
  gradient_checkpointing: true
  lora:
    r: 32
    alpha: 64
    dropout: 0.05
    bias: none
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    adapt_vision_tower: false
    modules_to_save: []

train:
  output_dir: ${SCRATCH}/vlm_finetuning/runs/smoke
  run_name: qwen25vl-cord-lora-smoke
  num_train_epochs: 1.0
  max_steps: 5
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.0
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 1
  eval_strategy: steps    # exercises the overridden _get_eval_sampler
  eval_steps: 5
  save_strategy: "no"     # the final adapter is written explicitly by save_adapter()
  save_steps: 5
  save_total_limit: 1
  bf16: true
  seed: 42
  report_to: none
  loss_type: chunked_nll
  completion_only_loss: true
  packing: false
  padding_free: false
